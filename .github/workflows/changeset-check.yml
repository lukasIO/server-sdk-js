# Fails a PR that changes a versioned package without a changeset, with a
# comment linking to a prefilled changeset file. The `internal` label
# skips the check.
name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukasIO/verwalter@v0.8.0
        with:
          command: check
